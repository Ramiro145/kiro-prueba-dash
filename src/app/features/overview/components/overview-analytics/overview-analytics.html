<section class="analytics" aria-label="Análisis agregado de planta para el turno">
  <header class="analytics__scope">
    <p>Alcance de planta</p>
    <strong>Los gráficos permanecen agregados aunque se seleccione una línea.</strong>
  </header>

  <article class="analytics-panel">
    <header>
      <p>{{ models().oee.eyebrow }}</p>
      <h2>{{ models().oee.title }}</h2>
    </header>
    <app-echart [option]="models().oee.option" [summary]="models().oee.summary" />
  </article>

  <article class="analytics-panel">
    <header>
      <p>{{ models().production.eyebrow }}</p>
      <h2>{{ models().production.title }}</h2>
    </header>
    <app-echart [option]="models().production.option" [summary]="models().production.summary" />
  </article>

  <article class="analytics-panel analytics-panel--wide">
    <header>
      <p>{{ models().downtime.eyebrow }}</p>
      <h2>{{ models().downtime.title }}</h2>
    </header>
    <app-echart [option]="models().downtime.option" [summary]="models().downtime.summary" />
  </article>
</section>
