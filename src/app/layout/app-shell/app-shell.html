<a class="skip-link" href="#main-content">Saltar al contenido principal</a>

<div
  class="shell"
  [class.shell--collapsed]="preferences().navigationCollapsed"
  [class.shell--compact]="preferences().density === 'compact'"
>
  <aside id="navigation-panel" class="shell__sidebar" aria-label="Navegación de operaciones">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">AC</span>
      <span class="brand__copy">
        <strong>Acero Control</strong>
        <small>Operación industrial</small>
      </span>
    </div>

    <button
      class="navigation-toggle"
      type="button"
      data-testid="navigation-toggle"
      aria-controls="navigation-panel"
      [attr.aria-expanded]="!preferences().navigationCollapsed"
      [attr.aria-label]="
        preferences().navigationCollapsed ? 'Expandir navegación' : 'Contraer navegación'
      "
      (click)="toggleNavigation()"
    >
      <span class="navigation-toggle__glyph" aria-hidden="true"></span>
    </button>

    <nav class="navigation" aria-label="Principal">
      <a
        routerLink="/overview"
        [queryParams]="{
          plant: filters().plantId,
          shift: filters().shiftId,
          line: filters().lineId,
        }"
        routerLinkActive="navigation__link--active"
        ariaCurrentWhenActive="page"
        title="Resumen"
      >
        <span class="navigation__glyph navigation__glyph--overview" aria-hidden="true"></span>
        <span class="navigation__label">Resumen</span>
      </a>
      <a
        [routerLink]="['/lines', selectedLineId()]"
        [queryParams]="{
          plant: filters().plantId,
          shift: filters().shiftId,
          line: selectedLineId(),
        }"
        routerLinkActive="navigation__link--active"
        ariaCurrentWhenActive="page"
        title="Detalle de línea"
      >
        <span class="navigation__glyph navigation__glyph--line" aria-hidden="true"></span>
        <span class="navigation__label">Detalle de línea</span>
      </a>
      <a
        routerLink="/alerts"
        [queryParams]="{
          plant: filters().plantId,
          shift: filters().shiftId,
          line: filters().lineId,
        }"
        routerLinkActive="navigation__link--active"
        ariaCurrentWhenActive="page"
        title="Alertas"
      >
        <span class="navigation__glyph navigation__glyph--alerts" aria-hidden="true"></span>
        <span class="navigation__label">Alertas</span>
      </a>
    </nav>

    <div class="system-state" role="status" [attr.data-tone]="connectionStatus().tone">
      <span class="system-state__indicator" aria-hidden="true"></span>
      <span class="system-state__copy">
        <strong>{{ connectionStatus().label }}</strong>
        <small>{{ connectionStatus().detail }}</small>
      </span>
    </div>
  </aside>

  <section class="shell__workspace">
    <header class="topbar">
      <div class="topbar__context">
        <span>Control de planta</span>
        <strong>Operación en turno</strong>
      </div>
      <div class="topbar__metadata" aria-label="Contexto operativo">
        <span><small>Planta</small> Norte</span>
        <span><small>Turno</small> {{ shiftName() }}</span>
        <button
          class="density-toggle"
          type="button"
          [attr.aria-pressed]="preferences().density === 'compact'"
          (click)="toggleDensity()"
        >
          Densidad {{ preferences().density === 'compact' ? 'compacta' : 'cómoda' }}
        </button>
        <span class="topbar__live" [attr.data-tone]="connectionStatus().tone"
          ><i aria-hidden="true"></i> {{ connectionStatus().label }}</span
        >
      </div>
    </header>

    <main #mainContent id="main-content" class="shell__content" tabindex="-1">
      <router-outlet />
    </main>
  </section>
</div>
